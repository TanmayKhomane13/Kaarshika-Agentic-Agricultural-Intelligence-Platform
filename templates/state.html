{% extends "base.html" %}

{% block title %}Farm State - Kaarshika-AI{% endblock %}

{% block content %}
<div class="farm-state-page">
    <div class="farm-form-card">
        <!-- Header -->
        <div class="farm-form-header">
            <h4>
                🌱 Farm State
            </h4>
            <p>
                Update your farm information
            </p>
        </div>

        <!-- Form -->
        <div class="farm-form-body">
            <form
                method="POST"
                action="{{ url_for('farm_state') }}"
            >
                <!-- Location -->
                <div class="login-field mb-3">
                    <label
                        for="location"
                    >
                        Location
                    </label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        class="form-control"
                        placeholder="e.g. Thrissur"
                        value="{{ farm_state.location if farm_state else '' }}"
                        required
                    >
                </div>

                <!-- Crop -->
                <div class="login-field mb-3">
                    <label
                        for="crop"
                    >
                        Crop
                    </label>
                    <input
                        type="text"
                        id="crop"
                        name="crop"
                        class="form-control"
                        placeholder="e.g. Soyabean"
                        value="{{ farm_state.crop if farm_state else '' }}"
                        required
                    >
                </div>

                <!-- Stage -->
                <div class="login-field mb-3">
                    <label
                        for="stage"
                    >
                        Stage
                    </label>
                    <input
                        type="text"
                        id="stage"
                        name="stage"
                        class="form-control"
                        placeholder="e.g. Flowering"
                        value="{{ farm_state.stage if farm_state else '' }}"
                        required
                    >
                </div>

                <!-- Acres -->
                <div class="login-field mb-3">
                    <label
                        for="acres"
                    >
                        Acres of Land
                    </label>

                    <input
                        type="number"
                        id="acres"
                        name="acres"
                        class="form-control"
                        placeholder="e.g. 2"
                        min="0.1"
                        step="0.1"
                        value="{{ farm_state.acres if farm_state else '' }}"
                        required
                    >
                </div>

                <!-- Soil Moisture -->
                <div class="login-field mb-4">
                    <label
                        for="soil_moisture"
                    >
                        Soil Moisture
                    </label>
                    <select
                        id="soil_moisture"
                        name="soil_moisture"
                        class="form-select"
                    >
                        <option
                            value="high"
                            {% if farm_state and farm_state.soil_moisture == 'high' %}
                                selected
                            {% endif %}
                        >
                            High
                        </option>

                        <option
                            value="moderate"
                            {% if farm_state and farm_state.soil_moisture == 'moderate' %}
                                selected
                            {% endif %}
                        >
                            Moderate
                        </option>
                        <option
                            value="low"
                            {% if farm_state and farm_state.soil_moisture == 'low' %}
                                selected
                            {% endif %}
                        >
                            Low
                        </option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="form-actions-group">
                    <button
                        type="submit"
                        class="btn-farm-submit"
                    >
                        {% if farm_state %}
                            Update Farm State
                        {% else %}
                            Save Farm State
                        {% endif %}
                    </button>

                    <a
                        href="{{ url_for('new_chat_page') }}"
                        class="btn-farm-outline"
                    >
                        Go to Chat
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
